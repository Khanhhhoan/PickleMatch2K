[tool.pyrefly]
python-interpreter-path = "venv/Scripts/python.exe"
search-path = [".", "backend", "venv/Lib/site-packages"]

[tool.pyrefly.errors]
bad-assignment = "ignore"
invalid-argument = "ignore"
no-matching-overload = "ignore"
unbound-name = "ignore"
unknown-attribute = "ignore"
missing-attribute = "ignore"
unsupported-operation = "ignore"
incompatible-override = "ignore"
invalid-override = "ignore"
invalid-type = "ignore"
not-callable = "ignore"
type-mismatch = "ignore"
report-general-type-issues = "ignore"
report-optional-member-access = "ignore"
report-attribute-access-issue = "ignore"
report-argument-type = "ignore"
report-return-type = "ignore"

[tool.pytest.ini_options]
cache_dir = "backend/.pytest_cache"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["venv", "backend/alembic/versions"]

[tool.ruff.lint]
# Lỗi cú pháp, tên chưa định nghĩa, định nghĩa lại, import/biến không dùng
select = ["E9", "F63", "F7", "F82", "F811", "F401", "F841"]

[tool.ruff.lint.per-file-ignores]
"backend/app/db/base.py" = ["F401"]
"backend/alembic/env.py" = ["F401"]
