# ==============================================================================
# PickleMatch2K trên một máy chủ AWS EC2, CSDL là Amazon RDS for PostgreSQL.
#
# Khác docker-compose.yml: không chạy PostgreSQL trong Docker. Backend nối thẳng tới RDS qua SSL và không bao giờ
# nạp dữ liệu demo. Hướng dẫn: README.md, mục 5, "Cách 4 - AWS".
#
# Cần ở thư mục gốc, trên máy EC2:
#   .env               sao chép từ .env.aws.example rồi điền (DATABASE_URL của RDS, SECRET_KEY, CORS_ORIGINS...)
#   global-bundle.pem  chứng chỉ gốc của RDS (thiếu file này thì lệnh up báo lỗi và không chạy):
#                      curl -fsSL -o global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
# Chạy:  docker compose -f docker-compose.aws.yml up -d --build
# Dừng:  docker compose -f docker-compose.aws.yml down        (dữ liệu nằm trên RDS, không mất)
# ==============================================================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # postgresql://postgres:MAT_KHAU@ENDPOINT_RDS:5432/pickleball_db?sslmode=verify-full&sslrootcert=/certs/global-bundle.pem
      DATABASE_URL: ${DATABASE_URL:?Thieu DATABASE_URL (dia chi RDS) trong file .env}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Thieu SECRET_KEY trong file .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # Địa chỉ trình duyệt mở hai cổng web, ví dụ http://IP_EC2:3000,http://IP_EC2:3001
      CORS_ORIGINS: ${CORS_ORIGINS:?Thieu CORS_ORIGINS trong file .env}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-10}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-}
      SEPAY_BANK_ACCOUNT: ${SEPAY_BANK_ACCOUNT:-}
      SEPAY_ACCOUNT_HOLDER: ${SEPAY_ACCOUNT_HOLDER:-}
      SEPAY_UNIFIED_TEST_MODE: ${SEPAY_UNIFIED_TEST_MODE:-true}
      SEPAY_SIMULATOR_ENABLED: ${SEPAY_SIMULATOR_ENABLED:-false}
      # CSDL trên RDS đã có dữ liệu: không nạp dữ liệu demo. Mỗi lần khởi động, backend vẫn tự nâng schema lên bản
      # mới nhất (không tự sao lưu, vì trong container không có pg_dump: dùng bản sao lưu tự động của RDS).
      SEED_DEMO_DATA: "false"
    volumes:
      # Kiểu khai báo dài: thiếu global-bundle.pem thì Docker báo lỗi ngay, không tạo thư mục rỗng cùng tên
      - type: bind
        source: ./global-bundle.pem
        target: /certs/global-bundle.pem
        read_only: true
      - uploads:/app/uploads
      - private_uploads:/app/private_uploads
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Để trống = trình duyệt gọi API ở cùng địa chỉ máy, cổng 8000: IP của EC2 đổi cũng không phải build lại
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin-portal:
    build:
      context: ./admin-portal
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  uploads:
  private_uploads:
