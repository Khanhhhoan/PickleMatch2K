# ==============================================================================
# PickleMatch2K - chạy toàn bộ hệ thống bằng Docker trên một máy (bản demo).
#
# Cần file .env ở thư mục gốc (sao chép từ .env.example) với tối thiểu:
#     SECRET_KEY=<chuỗi ngẫu nhiên dài>      POSTGRES_PASSWORD=<mật khẩu CSDL của container>
# Chạy:  docker compose up --build -d        Dừng:  docker compose down
#
# CSDL trong Docker là một CSDL RIÊNG (volume pgdata17), không phải PostgreSQL cài trên máy.
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: ${POSTGRES_DB:-pickleball_db}
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Cổng 5432 không mở ra ngoài: không đụng PostgreSQL cài sẵn trên máy và không lộ CSDL ra mạng.
    # Muốn xem bằng pgAdmin/DBeaver thì bỏ ghi chú hai dòng dưới (kết nối tới localhost:5433):
    # ports:
    #   - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Mật khẩu nằm trong URL: POSTGRES_PASSWORD chỉ nên gồm chữ và số (tránh @ : / # % $)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pickleball_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Thieu SECRET_KEY trong file .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-10}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-}
      SEPAY_BANK_ACCOUNT: ${SEPAY_BANK_ACCOUNT:-}
      SEPAY_ACCOUNT_HOLDER: ${SEPAY_ACCOUNT_HOLDER:-}
      SEPAY_UNIFIED_TEST_MODE: ${SEPAY_UNIFIED_TEST_MODE:-true}
      SEPAY_SIMULATOR_ENABLED: ${SEPAY_SIMULATOR_ENABLED:-false}
      # true: lần chạy đầu (CSDL trống) tự nạp dữ liệu demo, mọi tài khoản dùng mật khẩu 123456
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - uploads:/app/uploads
      - private_uploads:/app/private_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Để trống = trình duyệt tự gọi API ở cùng tên máy, cổng 8000 (dùng được cả từ điện thoại trong mạng LAN)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin-portal:
    build:
      context: ./admin-portal
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  # Tên volume có số phiên bản PostgreSQL: dữ liệu của bản cũ (PostgreSQL 15, volume postgres_data) không bị
  # gắn nhầm vào bản 17 và vẫn còn nguyên trên máy cho tới khi bạn tự xóa.
  pgdata17:
  uploads:
  # Chứng từ hoàn tiền (riêng tư): giữ lại khi build lại hay tạo lại container
  private_uploads:
